name: Generar calendario ICS

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

jobs:
  generar-calendario:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar calendario
        run: npm run calendario

      - name: Subir calendario actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar calendario automáticamente"
          file_pattern: laspistasfc_calendario.ics