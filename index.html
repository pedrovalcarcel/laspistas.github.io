<!DOCTYPE html>
<html lang="es">
<head class="cabecera_pagina">
    <meta charset="UTF-8">
    <title>LAS PISTAS FC</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-inicio">

    <header class="cabecera">
        <a href="index.html">
            <img src="escudo_laspistas.png" alt="Escudo" class="escudo">
        </a>
        <div class="cabecera-centro">
            <h1>LAS PISTAS FC</h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="resultados.html">Resultados</a>
                <a href="jugadores.html">Plantilla</a>
                <a href="estadisticas.html">Estadísticas</a>
                <a href="historico.html">Histórico</a>
            </nav>
        </div>
    </header>

    <section class="inicio-grid">

    <!-- ================= IZQUIERDA ================= -->

    <section class="bloque bloque-clasificacion">
        <h2>Clasificación</h2>
        <table class="tabla-clasificacion">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Equipo</th>
                    <th>PJ</th>
                    <th>PG</th>
                    <th>PE</th>
                    <th>PP</th>
                    <th>GF</th>
                    <th>GC</th>
                    <th>DG</th>
                    <th>Pts</th>
                </tr>
            </thead>
            <tbody id="cuerpo-clasificacion"></tbody>
        </table>
    </section>

    <!-- ================= CENTRO ================= -->
    <section class="bloque bloque-central">
        <div class="bloque-racha">
            <h2>Últimos 5 partidos</h2>
            <div id="racha" class="racha"></div>
        </div>
        <div class="bloque-foto">
            <img
                src="foto_equipo_laspistas.jpg"
                alt="Las Pistas FC"
                class="foto-equipo"
                id="foto-equipo"
            >
        </div>

        <div id="visor-foto" class="visor-foto">
            <img
                src="foto_equipo_laspistas.jpg"
                alt="Las Pistas FC"
                id="foto-grande"
            >
        </div>
        <div class="bloque-proximo">
            <h2>Próximo partido</h2>
            <div id="proximo-partido"></div>
        </div>

        <div class="bloque-calendario">

        <h2>Sincroniza tu calendario</h2>

        <div class="botones-calendario">

            <button id="btn-google" class="btn-calendario google">
                Google Calendar
            </button>

            <button id="btn-apple" class="btn-calendario apple">
                Apple Calendar
            </button>

            <button id="btn-outlook" class="btn-calendario outlook">
                Outlook
            </button>

        </div>

    </div>
        <!-- ==========================================
            RANKING ATAQUE / DEFENSA
        ========================================== -->

        <section class="tarjeta-ranking" id="tarjeta-ranking">

            <h2>Ranking ofensivo y defensivo</h2>

            <div id="contenido-ranking">

                Cargando...

            </div>

        </section>
    </section>

    

    <!-- ================= DERECHA ================= -->

    <section class="bloque bloque-calendarios">
        <div class="calendario-card">
            <h2 id="titulo-calendario-actual"></h2>
            <div id="calendario-actual"></div>
        </div>
        <div class="calendario-card">
            <h2 id="titulo-calendario-siguiente"></h2>
            <div id="calendario-siguiente"></div>
        </div>
    </section>
</section>

    <script src="modeloPrediccion.js"></script>
    <script src="configTemporadas.js"></script>
    <script src="temporada.js"></script>
    <script src="calendario.js"></script>
    <script src="clasificacion.js"></script>
    <script src="tooltip_racha.js"></script>
    <script src="racha.js"></script>
    <script src="partidos_mes.js"></script>
    <script src="proximo_partido.js"></script>
    <script src="foto_equipo.js"></script>
    <script src="calendario_sync.js"></script>
</body>
</html>
