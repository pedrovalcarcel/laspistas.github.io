<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-estadisticas">

    <header class="cabecera">

        <a href="index.html">
            <img src="escudo_laspistas.png" alt="Escudo" class="escudo">
        </a>

        <div class="cabecera-centro">

            <h1>Estadísticas de LAS PISTAS FC</h1>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="resultados.html">Resultados</a>
                <a href="jugadores.html">Plantilla</a>
                <a href="estadisticas.html">Estadísticas</a>
                <a href="historico.html">Histórico</a>
            </nav>

        </div>

        <img src="escudo_laspistas.png" alt="Escudo de Las Pistas FC" class="escudo escudo-derecha">

    </header>

    <ul id="estadisticas"></ul>

    <div class="dashboard-graficas">

        <!-- Evolución de puntos -->
        <div class="tarjeta-grafica">
            <h2>Puntos acumulados</h2>
            <canvas id="graficaPuntos"></canvas>
        </div>

        <!-- Victorias por hora -->
        <div class="tarjeta-grafica">
            <h2>Victorias según la hora</h2>
            <canvas id="graficaVictoriasHora"></canvas>
        </div>

        <!-- Goles -->
        <div class="tarjeta-grafica">
            <h2>Goles por jugador</h2>
            <canvas id="graficaGolesPorJugador"></canvas>
        </div>

        <!-- Asistencias -->
        <div class="tarjeta-grafica">
            <h2>Asistencias por jugador</h2>
            <canvas id="graficaAsistenciasPorJugador"></canvas>
        </div>

        <!-- Posición -->
        <div class="tarjeta-grafica tarjeta-ancha">
            <h2>Evolución de la posición</h2>
            <canvas id="graficaPosicion"></canvas>
        </div>

    </div>

    <!-- Árbitros -->
    <div class="bloque-arbitros">

        <h2>Rendimiento por árbitro</h2>

        <div id="estadisticas-arbitros"></div>

    </div>

    <!-- ==========================
         MODAL PARTIDOS POR HORA
    =========================== -->

    <div id="modalPartidos" class="modal-partidos">

        <div class="modal-contenido">

            <button id="cerrarModal" class="cerrar-modal">
                ✕
            </button>

            <h2 id="tituloModal"></h2>

            <div id="listaModal"></div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <script src="modeloPrediccion.js"></script>
    <script src="configTemporadas.js"></script>
    <script src="temporada.js"></script>

    <script src="estadisticas.js"></script>

</body>

</html>
